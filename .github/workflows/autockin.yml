name: autockin

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '42 9 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: checkin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test request handling
        run: python -m unittest discover -s tests -v

      - name: Check in
        run: python checkin.py
        env:
          USER_AGENT: ${{ vars.USER_AGENT }}
          ACCEPT_LANGUAGE: ${{ vars.ACCEPT_LANGUAGE }}
          COOKIES: ${{ secrets.COOKIES }}
